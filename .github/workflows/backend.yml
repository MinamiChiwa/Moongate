name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/Contracts/TypeScript/package-lock.json
      - name: Check repository layout and source baselines
        shell: pwsh
        run: |
          # The public export omits the internal documentation layout checker.
          if (Test-Path scripts/maintenance/check-repository-layout.py) {
            python -X utf8 scripts/maintenance/check-repository-layout.py
            if ($LASTEXITCODE -ne 0) { throw 'Repository layout check failed' }
          }
          python -X utf8 scripts/maintenance/check-source-baselines.py
          if ($LASTEXITCODE -ne 0) { throw 'Source baseline check failed' }
      - name: Build backend and desktop
        shell: pwsh
        run: ./scripts/build/backend.ps1 -Action Build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
